<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#f8fafc"><title>漢字N4 書き取り練習</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#1e293b;font-family:system-ui,'Noto Sans JP',sans-serif}main{max-width:620px;margin:auto;min-height:100dvh;background:white;padding:16px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:20px;margin:0}.count{font-size:14px;color:#64748b}h2{font-size:15px;margin:0 0 9px}.order{border:1px solid #cbd5e1;border-radius:12px;padding:12px;min-height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden}.order img{width:100%;height:auto;image-rendering:auto}.practice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.label{height:38px;text-align:center;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}.square{aspect-ratio:1;border:2px solid #94a3b8;border-radius:8px;position:relative;overflow:hidden;background:white}.square:before{content:'';position:absolute;top:50%;width:100%;border-top:1px dashed #cbd5e1}.square:after{content:'';position:absolute;left:50%;height:100%;border-left:1px dashed #cbd5e1;top:0}.sample{position:absolute;inset:10%;width:80%;height:80%;object-fit:contain;z-index:1;mix-blend-mode:multiply}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}.actions{display:flex;gap:10px;margin-top:16px}button{cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:13px 8px;font-weight:700;font-size:15px;color:#334155;flex:1}button:active{background:#e2e8f0}.navigation{display:flex;align-items:center;gap:10px;margin-top:28px}.navigation button{background:#2563eb;color:white;border-color:#2563eb}.navigation button:disabled{background:#cbd5e1;border-color:#cbd5e1}.tip{font-size:12px;color:#64748b;line-height:1.6;margin-top:22px} @media(max-width:360px){main{padding:10px}.practice{gap:8px}.label{font-size:16px}}
.page-picker{margin-top:16px;padding:8px 4px 0;position:relative}.page-slider{width:100%;accent-color:#2563eb;touch-action:pan-y;cursor:pointer}.page-scale{display:flex;justify-content:space-between;font-size:12px;color:#64748b}.page-preview{position:absolute;bottom:53px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #2563eb;border-radius:12px;min-width:90px;padding:7px 12px;text-align:center;box-shadow:0 4px 15px #0002;pointer-events:none;z-index:5}.page-preview[hidden]{display:none}.page-preview:after{content:"";position:absolute;left:calc(50% - 7px);bottom:-9px;width:13px;height:13px;background:white;border-right:2px solid #2563eb;border-bottom:2px solid #2563eb;transform:rotate(45deg)}.preview-kanji{font-size:40px;line-height:1.25}.preview-number{font-size:12px;color:#64748b}</style></head><body><main><header><h1>漢字N4 書き取り練習</h1><span id="count" class="count">1 / 163</span></header><h2>筆順（PDFの見本）</h2><div class="order"><img id="order" alt="筆順"></div><div class="practice"><div><div class="label" id="vietnamese">BẤT</div><div class="square"><img id="sample" class="sample" alt="漢字見本"></div></div><div><div class="label">書き取り</div><div class="square"><canvas id="canvas"></canvas></div></div></div><div class="actions"><button id="undo">↶ 1画戻す</button><button id="clear">全部消す</button></div><div class="navigation"><button id="prev">◀ 前へ</button><button id="next">次へ ▶</button></div><div class="page-picker"><div id="pagePreview" class="page-preview" hidden><div id="previewKanji" class="preview-kanji"></div><div id="previewNumber" class="preview-number"></div></div><input id="pageSlider" class="page-slider" type="range" min="1" max="163" value="1" step="1" aria-label="ページを選択"><div class="page-scale"><span>1</span><span id="sliderPosition">1 / 163</span><span id="sliderMax">163</span></div></div><p class="tip">右のマスに指やペンで書けます。筆順と見本画像はアップロードされたPDFを使用しています。採点機能はありません。</p></main><script>
let items=[],index=0,strokes=[],active=null;const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
function resize(){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);redraw()}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#1d4ed8';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';const w=canvas.clientWidth,h=canvas.clientHeight;for(const s of [...strokes,...(active?[active]:[])]){if(!s.length)continue;ctx.beginPath();ctx.moveTo(s[0][0]*w,s[0][1]*h);if(s.length===1){ctx.lineTo(s[0][0]*w+.1,s[0][1]*h+.1)}else for(const p of s.slice(1))ctx.lineTo(p[0]*w,p[1]*h);ctx.stroke()}}
function pos(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);active=[pos(e)];redraw()});canvas.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();active.push(pos(e));redraw()});function finish(){if(active){strokes.push(active);active=null;redraw()}}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
$('undo').onclick=()=>{if(active)finish();strokes.pop();redraw()};$('clear').onclick=()=>{active=null;strokes=[];redraw()};
function show(){const a=items[index];$('count').textContent=`${index+1} / ${items.length}`;$('vietnamese').textContent=a.vietnamese;$('order').src=a.order;$('sample').src=a.sample;$('pageSlider').value=index+1;$('pageSlider').max=items.length;$('sliderPosition').textContent=`${index+1} / ${items.length}`;$('sliderMax').textContent=items.length;$('prev').disabled=index===0;$('next').disabled=index===items.length-1;strokes=[];active=null;redraw();try{localStorage.setItem('kanji-page',index)}catch(e){}}
$('prev').onclick=()=>{if(index>0){index--;show()}};$('next').onclick=()=>{if(index<items.length-1){index++;show()}};
const slider=$('pageSlider'),preview=$('pagePreview');let sliding=false;
function previewPage(){if(!items.length)return;const n=Math.max(1,Math.min(items.length,Number(slider.value)));const a=items[n-1];$('previewNumber').textContent=`${n} / ${items.length}`;$('sliderPosition').textContent=`${n} / ${items.length}`;const image=a.sample;const k=$('previewKanji');k.replaceChildren();if(image){const img=document.createElement('img');img.src=image;img.alt=a.vietnamese||'漢字';img.style.cssText='width:52px;height:52px;object-fit:contain';k.append(img)}else{k.textContent=a.vietnamese||'漢字'}preview.hidden=false;}
function commitPage(){if(!sliding)return;sliding=false;preview.hidden=true;if(!items.length)return;const n=Number(slider.value)-1;if(n!==index){index=n;show()}else{$('sliderPosition').textContent=`${index+1} / ${items.length}`}}
slider.addEventListener('pointerdown',()=>{sliding=true;previewPage()});slider.addEventListener('input',()=>{sliding=true;previewPage()});slider.addEventListener('change',commitPage);slider.addEventListener('pointerup',commitPage);slider.addEventListener('pointercancel',()=>{sliding=false;preview.hidden=true;slider.value=index+1;$('sliderPosition').textContent=`${index+1} / ${items.length}`});slider.addEventListener('blur',commitPage);
window.addEventListener('resize',resize);fetch('data.json').then(r=>r.json()).then(data=>{items=data;try{index=Math.max(0,Math.min(items.length-1,Number(localStorage.getItem('kanji-page'))||0))}catch(e){}show();resize()}).catch(()=>{$('count').textContent='データを読み込めませんでした。Webサーバーで開いてください。'});
</script></body></html>
